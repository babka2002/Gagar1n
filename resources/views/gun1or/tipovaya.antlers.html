<section class="py-sectionPadding bg-gradient-to-b from-blue-50 to-white">
    <div class="container px-4">
        {{ if tipovaya_image }}
        <div
            style="background-image: url('{{ glide:data_url src=tipovaya_image quality='75' format='webp' }}');"
            class="bg-no-repeat bg-cover w-full h-[300px] lg:h-[400px] rounded-3xl mb-8 shadow-lg"
        ></div>
        {{ /if }}

        <div class="max-w-4xl mx-auto">
            <h1
                class="text-2xl md:text-4xl lg:text-5xl uppercase text-[#2C498D] font-bold text-center mb-8 leading-tight"
            >
                {{ title }}
            </h1>

            {{ if tipovaya_markdown }}
            <div
                class="prose prose-lg max-w-none text-gray-700 prose-headings:text-[#2C498D] prose-headings:font-bold prose-h1:text-3xl prose-h1:mb-6 prose-h1:mt-8 prose-h2:text-2xl prose-h2:mb-4 prose-h2:mt-6 prose-h2:border-b-2 prose-h2:border-blue-200 prose-h2:pb-2 prose-h3:text-xl prose-h3:mb-3 prose-h3:mt-4 prose-h3:text-[#3B82F6] prose-p:text-gray-700 prose-p:leading-relaxed prose-p:mb-4 prose-strong:text-[#2C498D] prose-strong:font-semibold prose-ul:list-none prose-ul:space-y-2 prose-li:relative prose-li:pl-6 prose-li:before:content-['🎯'] prose-li:before:absolute prose-li:before:left-0 prose-a:text-[#3B82F6] prose-a:font-medium hover:prose-a:text-[#2C498D] prose-a:transition-colors prose-table:border-collapse prose-table:w-full prose-table:mt-6 prose-table:mb-6 prose-th:bg-[#3B82F6] prose-th:text-white prose-th:p-3 prose-th:text-left prose-th:font-semibold prose-td:border prose-td:border-gray-200 prose-td:p-3 prose-td:align-top prose-tr:even:bg-blue-50 prose-blockquote:border-l-4 prose-blockquote:border-[#3B82F6] prose-blockquote:bg-blue-50 prose-blockquote:p-4 prose-blockquote:rounded-r-lg prose-code:bg-blue-100 prose-code:text-[#2C498D] prose-code:px-2 prose-code:py-1 prose-code:rounded prose-hr:border-[#3B82F6] prose-hr:border-2 prose-hr:my-8"
            >
                {{ tipovaya_markdown | markdown }}
            </div>
            {{ elseif tipovaya_html }}
            <div
                class="prose prose-lg max-w-none mt-8 text-gray-700 prose-headings:text-[#2C498D] prose-headings:font-bold prose-p:text-gray-700 prose-p:leading-relaxed prose-p:mb-4 prose-ul:space-y-2 prose-li:relative prose-li:pl-6 prose-li:before:content-['🎯'] prose-li:before:absolute prose-li:before:left-0 prose-strong:text-[#2C498D] prose-strong:font-semibold"
            >
                {{ tipovaya_html }}
            </div>
            {{ else }}
            <div
                class="bg-gradient-to-r from-blue-100 to-purple-100 rounded-2xl p-6 mt-8"
            >
                <div class="text-gray-700 leading-relaxed whitespace-pre-line">
                    {{ tipovaya_text }}
                </div>
            </div>
            {{ /if }}
        </div>
    </div>
</section>

<!-- Декоративные элементы -->
<div
    class="fixed bottom-10 right-10 text-6xl animate-bounce opacity-20 pointer-events-none z-0"
>
    🚀
</div>
<div
    class="fixed top-20 left-10 text-4xl animate-pulse opacity-20 pointer-events-none z-0"
>
    ⭐
</div>
<div
    class="fixed top-1/2 right-20 text-5xl animate-spin opacity-20 pointer-events-none z-0"
    style="animation-duration: 10s"
>
    🎯
</div>

{{ if custom_html_script }} {{!! custom_html_script !!}} {{ /if }}
