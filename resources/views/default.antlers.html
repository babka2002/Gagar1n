{{# Default fallback template for entries using template: default #}}
<section class="container mx-auto px-4 py-8">
    {{ if title }}
        <h1 class="text-2xl font-semibold mb-4">{{ title }}</h1>
    {{ /if }}

    {{ if content }}
        {{ content }}
    {{ else }}
        {{ if bard }}
            {{ bard }}
        {{ /if }}
        {{ if text }}
            {{ text }}
        {{ /if }}
    {{ /if }}
</section>
