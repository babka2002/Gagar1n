title: "Gun1or - Страница тренеров (детская)"
tabs:
  main:
    display: Основное
    sections:
      - display: Шаблон
        fields:
          - handle: template
            field:
              type: template
              display: Шаблон
              localizable: false
              default: gun1or/trainers
      - display: "Hero секция (детская)"
        instructions: "Главный баннер с яркими цветами и декорациями"
        fields:
          - handle: hero_title
            field:
              type: text
              display: "Заголовок Hero"
              instructions: "Заголовок в главном блоке"
              localizable: false
              default: "Наши тренеры для детей"
          - handle: hero_subtitle
            field:
              type: text
              display: "Подзаголовок Hero"
              localizable: false
              default: "Профессионалы, которые сделают спорт увлекательным приключением!"
          - handle: hero_image
            field:
              type: assets
              container: assets
              display: "Картинка Hero"
              max_files: 1
              localizable: false
              instructions: "Изображение для главного блока (детская тематика)"
              default: "img/kids-hero.jpg"

  blocks:
    display: "Контентные блоки"
    sections:
      - display: 'Блок "Хочешь попробовать?"'
        instructions: "Призыв к действию для записи на пробное занятие"
        fields:
          - handle: cta_title
            field:
              type: text
              display: "Заголовок блока"
              localizable: false
              default: "Хочешь попробовать?"
          - handle: cta_main_title
            field:
              type: text
              display: "Основной заголовок в блоке"
              localizable: false
              default: "Первое занятие БЕСПЛАТНО!"
          - handle: cta_description
            field:
              type: textarea
              display: "Описание блока"
              localizable: false
              rows: 3
              default: "Приходи познакомиться с нашими тренерами и попробовать детский фитнес. Мы найдем подходящую программу именно для твоего ребенка!"
          - handle: cta_button_text
            field:
              type: text
              display: "Текст кнопки"
              localizable: false
              default: "Записаться на пробное занятие"
          - handle: cta_emoji
            field:
              type: text
              display: "Эмодзи в центре блока"
              localizable: false
              default: "🏃‍♀️👦👧"
              instructions: "Эмодзи для декоративного элемента"
          - handle: cta_link
            field:
              type: link
              display: "Ссылка кнопки"
              localizable: false
              default: "#"

      - display: "Настройки дизайна"
        instructions: "Цвета и стилизация для детской темы"
        fields:
          - handle: primary_color
            field:
              type: color
              display: "Основной цвет"
              localizable: false
              default: "#3B82F6"
              instructions: "Цвет кнопок и акцентов"
          - handle: button_hover_color
            field:
              type: color
              display: "Цвет кнопки при наведении"
              localizable: false
              default: "#2563EB"
          - handle: gradient_from
            field:
              type: color
              display: "Начальный цвет градиента Hero"
              localizable: false
              default: "#60A5FA"
          - handle: gradient_to
            field:
              type: color
              display: "Конечный цвет градиента Hero"
              localizable: false
              default: "#F472B6"

  seo_tab:
    display: SEO
    sections:
      - display: "SEO настройки"
        fields:
          - handle: seo_title
            field:
              type: text
              display: "SEO Заголовок"
              instructions: "Если не заполнено, будет использован текущий title страницы"
              localizable: false
              validate:
                - "max:60"
          - handle: field_meta_description
            field:
              type: textarea
              display: "Краткое описание страницы"
              localizable: false
          - handle: field_meta_keywords
            field:
              type: textarea
              display: "ключевые, слова, через, запятую"
              localizable: false

  sidebar:
    display: Sidebar
    sections:
      - fields:
          - handle: slug
            field:
              type: slug
              localizable: true
              validate: "max:200"
          - handle: parent
            field:
              type: entries
              collections:
                - pages
              max_items: 1
              listable: false
              localizable: true
