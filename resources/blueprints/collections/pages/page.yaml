title: Page
tabs:
  main:
    display: Main
    sections:
      -
        display: Hero
        instructions: hero
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
              localizable: false
          -
            handle: hero_title
            field:
              type: text
              validate:
                - required
              display: 'Hero Title'
              localizable: false
          -
            handle: hero_desc_group
            field:
              type: group
              display: 'Hero Desc Group'
              localizable: false
              fields:
                -
                  handle: pole_text_1
                  field:
                    type: text
                    display: 'Поле Text 1'
                -
                  handle: pole_text_discont
                  field:
                    type: text
                    display: 'Поле Text Discont'
                -
                  handle: pole_text_2
                  field:
                    type: text
                    display: 'Поле Text 2'
                -
                  handle: pole_text_3
                  field:
                    type: text
                    display: 'Поле Text 3'
          -
            handle: hero_1
            field:
              container: assets
              type: assets
              display: 'Hero 1'
              max_files: 1
              min_files: 1
              localizable: false
          -
            handle: hero_2
            field:
              container: assets
              type: assets
              display: 'Hero 2'
              max_files: 1
              min_files: 1
              localizable: false
          -
            handle: template
            field:
              type: template
              display: Template
              localizable: true
          -
            handle: hero_onlick_html
            field:
              type: html
              display: 'Подробнее onclick'
              instructions: 'связать с popup для сайта'
              localizable: false
              instructions_position: below
      -
        display: Direction
        instructions: direction
        fields:
          -
            handle: direction_title
            field:
              type: text
              display: 'Direction Title'
              localizable: false
          -
            handle: direction_replicator
            field:
              type: replicator
              display: 'DIRECTION Replicator'
              localizable: false
              sets:
                novaya_gruppa_naborov:
                  display: 'Новая группа наборов'
                  sets:
                    direction:
                      display: Direction
                      fields:
                        -
                          handle: inversion
                          field:
                            type: toggle
                            display: Inversion
                        -
                          handle: direction_title
                          field:
                            type: text
                            display: 'DIRECTION Title'
                        -
                          handle: direction_image
                          field:
                            max_files: 1
                            min_files: 1
                            container: assets
                            type: assets
                            display: 'DIRECTION image'
                        -
                          handle: direction_link
                          field:
                            type: link
                            display: Ссылка
          -
            handle: template_2
            field:
              type: template
              display: Template
              localizable: false
      -
        display: Абонемент
        instructions: ABONIMENT
        fields:
          -
            handle: aboniment_raspisanie_zagolovok
            field:
              type: text
              display: 'Расписание заголовок'
              localizable: false
          -
            handle: aboniment_raspisanie_text
            field:
              type: text
              display: 'Расписание текст'
              localizable: false
          -
            handle: aboniment_raspisanie_link
            field:
              type: link
              display: 'Расписание ссылка'
              localizable: false
          -
            handle: aboniment_our_team_pretitle
            field:
              type: text
              display: 'Наша команда пре-заголовок'
              localizable: false
          -
            handle: aboniment_our_team_title
            field:
              type: text
              display: 'Наша команда заголовок'
              localizable: false
          -
            handle: aboniment_our_team_description
            field:
              type: text
              display: 'Наша команда описание'
              localizable: false
          -
            handle: aboniment_our_team_image
            field:
              max_files: 1
              min_files: 1
              container: assets
              type: assets
              display: 'Наша команда картинка'
              localizable: false
          -
            handle: aboniment_our_team_link
            field:
              type: link
              display: 'Наша команда ссылка'
              localizable: false
          -
            handle: aboniment_title
            field:
              type: text
              display: 'Абонемент заголовок'
              localizable: false
          -
            handle: aboniment_type
            field:
              type: replicator
              display: 'Абонемент тип'
              localizable: false
              sets:
                novaya_gruppa_naborov:
                  display: 'Новая группа наборов'
                  sets:
                    novyy_nabor:
                      display: 'Новый набор'
                      fields:
                        -
                          handle: aboniment_image_front
                          field:
                            max_files: 1
                            min_files: 1
                            container: assets
                            type: assets
                            display: 'ABONIMENT image front'
                            localizable: false
                        -
                          handle: aboniment_image_rear
                          field:
                            max_files: 1
                            min_files: 1
                            container: assets
                            type: assets
                            display: 'ABONIMENT image rear'
                            localizable: false
                        -
                          handle: aboniment_link
                          field:
                            collections:
                              - pages
                              - klubnaya_karta
                            type: link
                            display: 'Aboniment link'
                            localizable: false
      -
        display: FORM
        instructions: FORM
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: parent
            field:
              type: entries
              collections:
                - pages
              max_items: 1
              listable: false
              localizable: true
