title: Типовая
meta_description: 'Мета описание'
tabs:
  main:
    display: Основное
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              localizable: false
              validate:
                - required
          -
            handle: tipovaya_image
            field:
              container: assets
              type: assets
              display: Картинка
              localizable: false
          -
            handle: tipovaya_markdown
            field:
              type: markdown
              display: 'Описание MD'
              localizable: false
          -
            handle: tipovaya_html
            field:
              remove_empty_nodes: false
              type: bard
              display: Описание
              localizable: false
          -
            handle: tipovaya_text
            field:
              type: textarea
              display: Текст
              localizable: false
          -
            handle: custom_html_script
            field:
              type: code
              display: 'Html Script'
              localizable: false
              antlers: true
      -
        display: Шаблон
        fields:
          -
            handle: template
            field:
              type: template
              display: 'Поле Шаблон'
              localizable: false
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: parent
            field:
              type: entries
              collections:
                - pages
              max_items: 1
              listable: false
              localizable: true
  seo_tab:
    display: SEO
    sections:
      -
        display: 'Новая секция'
        fields:
          -
            handle: field_meta_description
            field:
              type: textarea
              display: 'Краткое описание страницы'
              localizable: false
          -
            handle: field_meta_keywords
            field:
              type: textarea
              display: 'ключевые, слова, через, запятую'
              localizable: false
